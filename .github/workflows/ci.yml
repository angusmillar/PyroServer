name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: src
        run: dotnet restore Abm.Pyro.CI.slnf

      - name: Build
        working-directory: src
        run: dotnet build Abm.Pyro.CI.slnf -c Release --no-restore

      - name: Test
        working-directory: src
        run: dotnet test Abm.Pyro.CI.slnf -c Release --no-build --verbosity normal
